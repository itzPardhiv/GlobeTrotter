<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GlobeTrotter: The Lost Relic — Pixel Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05070c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Rajdhani', sans-serif;
        color: #e5d8b8;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 1920px;
        max-height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f1422 0%, #05070c 100%);
      }
      canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 80px rgba(212, 175, 55, 0.12);
        border: 2px solid #231c14;
      }
      #loader-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #07090f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }
      #loader-overlay.hidden {
        opacity: 0;
      }
      .loader-title {
        font-family: 'Cinzel', serif;
        font-size: 28px;
        letter-spacing: 4px;
        color: #d4af37;
        margin-bottom: 8px;
        text-shadow: 0 0 16px rgba(212, 175, 55, 0.5);
      }
      .loader-subtitle {
        font-size: 14px;
        letter-spacing: 2px;
        color: #a49175;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="loader-overlay">
        <h1 class="loader-title">GLOBETROTTER</h1>
        <p class="loader-subtitle">The Lost Relic · Pixel Edition</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
